name: CodeQL

# Análisis de seguridad del código de GitHub (gratis en repositorios públicos). Busca errores
# típicos que abren la puerta a ataques: inyecciones, redirecciones abiertas, datos sin
# validar, etc. Corre en cada PR, en cada cambio de main y los domingos. Los avisos salen en
# la pestaña Security del repositorio.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
